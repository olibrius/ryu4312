name: CI

on:
  push:
    branches: [master, packaging, remove-six, python3-compat-fixes]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pbr
          pip install -r tools/pip-requires -r tools/test-requires
          pip install -e .

      - name: Run smoke tests
        run: python -m pytest ryu/tests/unit/test_smoke.py -v

      - name: Run unit tests
        run: |
          python -m pytest ryu/tests/unit/ \
            --ignore=ryu/tests/unit/services/protocols/ovsdb \
            --ignore=ryu/tests/unit/lib/ovs \
            -q
